name: zal

services:
  postgres:
    image: postgres:16-alpine
    container_name: zal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zal
      POSTGRES_PASSWORD: zal
      POSTGRES_DB: zal
    ports:
      - '5432:5432'
    volumes:
      - zal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zal -d zal']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zal-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - zal-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: zal-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zal
      MINIO_ROOT_PASSWORD: zalzalzal
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - zal-miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: zal-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  zal-pgdata:
  zal-redisdata:
  zal-miniodata:
