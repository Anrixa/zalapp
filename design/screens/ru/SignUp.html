<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zal — регистрация</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#241A18;background:#FBF6EF}
.display{font-family:'Fraunces',Georgia,serif}
a{text-decoration:none}
label{font-size:13px;font-weight:700;color:#241A18;margin-bottom:7px;display:block}
.input{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid #E7DACB;background:#fff;font-size:15px;color:#241A18}
.input::placeholder{color:#A8998E}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;background:#A32638;color:#FBF6EF;font-weight:600;font-size:16px;padding:17px;border-radius:999px;box-shadow:0 8px 20px -8px rgba(163,38,56,0.55);width:100%}
.btn-secondary{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#241A18;font-weight:600;font-size:15px;padding:15px;border-radius:999px;border:1.5px solid #E7DACB;width:100%}


html{background:#EFE5D8;}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;}
</style>
</head>
<body>
<div style="width:390px;height:924px;background:#FBF6EF;display:flex;flex-direction:column;">
  <div style="padding:20px 24px 0;">
    <a href="Onboarding.html" class="icon-btn" style="width:40px;height:40px;border-radius:999px;background:#F4EBDD;display:inline-flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#241A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
  </div>

  <div style="padding:20px 24px 0;flex:1;overflow:hidden;">
    <h1 class="display" style="font-size:28px;font-weight:700;">Создайте аккаунт</h1>
    <p style="margin-top:6px;font-size:14px;color:#6B5C56;">Это займёт меньше минуты.</p>

    <div style="margin-top:26px;display:flex;flex-direction:column;gap:16px;">
      <div>
        <label>Полное имя</label>
        <input class="input" placeholder="Ани Саргсян">
      </div>
      <div>
        <label>Номер телефона</label>
        <div style="display:flex;gap:8px;">
          <div style="width:74px;padding:15px 10px;border-radius:14px;border:1.5px solid #E7DACB;background:#fff;font-size:15px;text-align:center;font-weight:600;">+374</div>
          <input class="input" style="flex:1;" placeholder="77 123 456">
        </div>
      </div>
      <div>
        <label>Email <span style="color:#A8998E;font-weight:500;">(необязательно)</span></label>
        <input class="input" placeholder="ani@email.com">
      </div>
      <div>
        <label>Password</label>
        <div style="position:relative;">
          <input class="input" type="password" placeholder="Минимум 8 символов">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8998E" stroke-width="1.7" style="position:absolute;right:16px;top:50%;transform:translateY(-50%);"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:flex-start;gap:10px;margin-top:18px;">
      <div style="width:20px;height:20px;border-radius:6px;background:#A32638;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FBF6EF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <p style="font-size:12.5px;color:#6B5C56;line-height:1.5;">Я согласен с <a href="#" style="color:#A32638;font-weight:600;">Условиями использования</a> и <a href="#" style="color:#A32638;font-weight:600;">Политикой конфиденциальности</a>.</p>
    </div>
  </div>

  <div style="padding:16px 24px 32px;display:flex;flex-direction:column;gap:14px;">
    <a href="OTP.html" class="btn-primary">Создать аккаунт</a>
    <div style="display:flex;align-items:center;gap:10px;color:#A8998E;font-size:12px;font-weight:600;">
      <div style="flex:1;height:1px;background:#E7DACB;"></div>OR<div style="flex:1;height:1px;background:#E7DACB;"></div>
    </div>
    <a href="OTP.html" class="btn-secondary">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.8c-.3 1.4-1 2.6-2.2 3.4v2.8h3.6c2.1-1.9 3.3-4.8 3.3-8.2Z"/><path fill="#34A853" d="M12 23c2.7 0 5-.9 6.6-2.5l-3.6-2.8c-1 .7-2.2 1.1-3 1.1-2.9 0-5.4-2-6.3-4.6H2.2v2.9C4 20.5 7.7 23 12 23Z"/><path fill="#FBBC05" d="M5.7 14.2c-.2-.7-.4-1.4-.4-2.2s.1-1.5.4-2.2V7H2.2A11 11 0 0 0 1 12c0 1.8.4 3.5 1.2 5l3.5-2.8Z"/><path fill="#EA4335" d="M12 5.4c1.5 0 2.8.5 3.9 1.5l3.2-3.1C17 2 14.7 1 12 1 7.7 1 4 3.5 2.2 7l3.5 2.8c.9-2.6 3.4-4.4 6.3-4.4Z"/></svg>
      Продолжить с Google
    </a>
    <div style="text-align:center;font-size:13.5px;color:#6B5C56;">Уже есть аккаунт? <a href="Login.html" style="color:#A32638;font-weight:700;">Log in</a></div>
  </div>
</div>
</body>
</html>
