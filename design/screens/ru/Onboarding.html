<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zal — введение</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#241A18;background:#FBF6EF}
.display{font-family:'Fraunces',Georgia,serif}
a{text-decoration:none}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;background:#A32638;color:#FBF6EF;font-weight:600;font-size:16px;padding:17px;border-radius:999px;box-shadow:0 8px 20px -8px rgba(163,38,56,0.55)}


html{background:#EFE5D8;}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;}
</style>
</head>
<body>
<div style="width:390px;height:844px;background:#FBF6EF;display:flex;flex-direction:column;">
  <div style="display:flex;justify-content:flex-end;padding:20px 24px 0;">
    <a href="SignUp.html" style="font-size:14px;font-weight:700;color:#6B5C56;">Пропустить</a>
  </div>

  <div style="padding:16px 24px 0;">
    <div style="width:342px;height:300px;border-radius:24px;background:linear-gradient(160deg,#F0AE5E,#A32638);position:relative;overflow:hidden;">
      <svg width="342" height="300" style="position:absolute;inset:0;opacity:0.16;" viewBox="0 0 342 300" fill="none">
        <path d="M40 260V150A60 60 0 0 1 160 150V260" stroke="#FBF6EF" stroke-width="8"/>
        <path d="M180 260V180A40 40 0 0 1 260 180V260" stroke="#FBF6EF" stroke-width="8"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#FBF6EF" stroke-width="1.4"><path d="M4 17.5 9 10l4 4.5 3-3.5 4 6.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="7.5" r="1.6"/><rect x="3" y="4" width="18" height="16" rx="3" stroke-linejoin="round"/></svg>
      </div>
      <div style="position:absolute;left:16px;bottom:16px;background:rgba(36,26,24,0.4);color:#FBF6EF;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;">1400+ залов по всей Армении</div>
    </div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;padding:32px 24px 0;">
    <h1 class="display" style="font-size:30px;font-weight:700;line-height:1.2;">Каждый праздник заслуживает подходящий зал</h1>
    <p style="margin-top:12px;font-size:15px;color:#6B5C56;line-height:1.6;">Сравнивайте реальные фото, цены и свободные даты свадебных залов, ресторанов и площадок &mdash; и бронируйте дату за пару минут.</p>
    <div style="display:flex;gap:6px;margin-top:24px;">
      <div style="width:6px;height:6px;border-radius:999px;background:#E7DACB;"></div>
      <div style="width:22px;height:6px;border-radius:999px;background:#A32638;"></div>
      <div style="width:6px;height:6px;border-radius:999px;background:#E7DACB;"></div>
    </div>
  </div>

  <div style="padding:20px 24px 36px;display:flex;flex-direction:column;gap:14px;">
    <a href="SignUp.html" class="btn-primary">Создать аккаунт</a>
    <a href="Login.html" style="text-align:center;font-size:14px;font-weight:700;color:#241A18;padding:8px;">У меня уже есть аккаунт</a>
  </div>
</div>
</body>
</html>
