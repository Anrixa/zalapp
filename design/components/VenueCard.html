<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zal — component: Venue card</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;color:#241A18}
.display{font-family:'Fraunces',Georgia,serif}

html{background:#EFE5D8;}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;}
</style>
</head>
<body>
<div style="width:358px;">
  <a href="VenueDetail.html" style="display:block;position:relative;width:358px;height:200px;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#C7495A,#7E1D2B);text-decoration:none;color:inherit;">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0.9;">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#F6E2E1" stroke-width="1.4"><path d="M4 17.5 9 10l4 4.5 3-3.5 4 6.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="7.5" r="1.6"/><rect x="3" y="4" width="18" height="16" rx="3" stroke-linejoin="round"/></svg>
    </div>
    <div style="position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:999px;background:rgba(36,26,24,0.35);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="rgba(36,26,24,0.25)" stroke="#FBF6EF" stroke-width="1.8"><path d="M12 20.2s-7.7-4.6-9.9-9.4C.6 7.6 2.2 4.4 5.4 3.7c2-.4 3.9.4 5 2.1a.7.7 0 0 0 1.2 0c1.1-1.7 3-2.5 5-2.1 3.2.7 4.8 3.9 3.3 7.1-2.2 4.8-9.9 9.4-9.9 9.4Z"/></svg>
    </div>
    <div style="position:absolute;left:12px;bottom:12px;background:rgba(36,26,24,0.55);backdrop-filter:blur(6px);color:#FBF6EF;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;">Banquet hall</div>
  </a>
  <a href="VenueDetail.html" style="display:block;margin-top:12px;text-decoration:none;color:inherit;">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
      <div class="display" style="font-size:17px;font-weight:700;line-height:1.25;">Dvin Hall</div>
      <div style="display:flex;align-items:center;gap:3px;flex-shrink:0;padding-top:2px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#E8933A" stroke="#E8933A" stroke-width="1"><path d="M12 2.5 15 9l7 .9-5.1 4.8L18.2 21 12 17.4 5.8 21 7.1 14.7 2 9.9 9 9Z"/></svg>
        <span style="font-size:13px;font-weight:700;">4.9</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:5px;margin-top:4px;color:#6B5C56;font-size:13px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B5C56" stroke-width="1.8"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.3"/></svg>
      <span>Kentron, Yerevan</span>
      <span style="color:#D8CBBC">&middot;</span>
      <span>up to 250 guests</span>
    </div>
    <div style="margin-top:8px;font-size:14px;">
      <span class="display" style="font-weight:700;font-size:16px;">420,000 AMD</span>
      <span style="color:#6B5C56;"> / event</span>
    </div>
  </a>

</html>
